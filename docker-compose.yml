services:
  bot:
    image: ghcr.io/gladishevvasiliy/stm-bot:latest
    restart: unless-stopped
    env_file: ./bot.env
    volumes:
      - buddy-report-settings:/app/report-settings:ro

  bot-test:
    image: ghcr.io/gladishevvasiliy/stm-bot:test
    restart: unless-stopped
    env_file: ./bot-test.env

  stm-admin-bot:
    image: ghcr.io/gladishevvasiliy/stm-bot:latest
    command: ["node", "build/admin/index.js"]
    restart: unless-stopped
    env_file: ./bot.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - buddy-report-settings:/app/report-settings

  slack-to-telegram:
    image: ghcr.io/gladishevvasiliy/slack-to-telegram:latest
    restart: unless-stopped
    env_file: ./slack-to-telegram.env
    ports:
      - "3000:3000"

volumes:
  buddy-report-settings:
